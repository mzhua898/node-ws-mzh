<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperBootstrap 配置生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        /* 
           重点修改在这里：
           1. 输入框背景改为 #1a1a1a (深灰)，不刺眼但清晰可见。
           2. 聚焦时变为 #252525 (稍微亮一点的灰)。
        */
        .input-box {
            @apply w-full bg-[#1a1a1a] border border-transparent rounded text-gray-300 text-sm px-4 py-3 
            focus:outline-none focus:bg-[#252525] focus:ring-1 focus:ring-gray-600 transition-all placeholder-gray-600;
        }

        /* 标签颜色调暗，不抢眼 */
        .input-label {
            @apply block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 ml-1;
        }

        /* 区域分割线 */
        .section-header {
            @apply flex items-center gap-2 text-sm font-semibold text-gray-400 border-b border-[#222] pb-2 mb-4 mt-2;
        }
        
        /* 高亮文字 */
        .hl { @apply text-blue-500; }
    </style>
</head>
<body class="bg-black text-gray-400 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-6xl bg-[#0a0a0a] border border-[#222] rounded-lg shadow-2xl">
        
        <!-- Header -->
        <div class="border-b border-[#222] p-6 flex flex-col sm:flex-row justify-between items-end sm:items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-gray-200 tracking-tight">PaperBootstrap <span class="text-gray-600">Generator</span></h1>
            </div>
            <button onclick="generateUUID()" class="text-xs bg-[#1a1a1a] hover:bg-[#252525] text-gray-400 py-2 px-4 rounded transition flex items-center gap-2 border border-[#333]">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                生成 UUID
            </button>
        </div>

        <!-- 布局核心：Grid System -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-0 lg:divide-x divide-[#222]">
            
            <!-- 左侧面板 -->
            <div class="p-6 md:p-8 space-y-6">
                <!-- Group 1 -->
                <div>
                    <div class="section-header">01 / 基础信息</div>
                    <div class="space-y-4">
                        <div>
                            <label class="input-label">UUID</label>
                            <input type="text" id="UUID" class="input-box font-mono text-blue-400" value="56ff8aef-19a9-4043-8d4c-d38361c8f651">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="input-label">Name</label>
                                <input type="text" id="NAME" class="input-box" value="mcwhua">
                            </div>
                            <div>
                                <label class="input-label">File Path</label>
                                <input type="text" id="FILE_PATH" class="input-box" value="./world">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Group 2 -->
                <div>
                    <div class="section-header">02 / 代理端口</div>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="input-label">HY2</label>
                            <input type="number" id="HY2_PORT" class="input-box" value="10297">
                        </div>
                        <div>
                            <label class="input-label">TUIC</label>
                            <input type="number" id="TUIC_PORT" class="input-box" value="8166">
                        </div>
                        <div>
                            <label class="input-label">Reality</label>
                            <input type="number" id="REALITY_PORT" class="input-box" placeholder="Off">
                        </div>
                    </div>
                </div>

                <!-- Group 3 -->
                 <div>
                    <div class="section-header">03 / Cloudflare IP</div>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-2">
                            <label class="input-label">IP Address</label>
                            <input type="text" id="CFIP" class="input-box" placeholder="优选 IP">
                        </div>
                        <div class="col-span-1">
                            <label class="input-label">Port</label>
                            <input type="number" id="CFPORT" class="input-box" placeholder="443">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧面板 -->
            <div class="p-6 md:p-8 space-y-6">
                <!-- Group 4: Nezha (修复对齐问题) -->
                <div>
                    <div class="section-header">04 / Nezha 监控</div>
                    <div class="space-y-4">
                        <div>
                            <label class="input-label">Server Address</label>
                            <input type="text" id="NEZHA_SERVER" class="input-box" placeholder="nezha.example.com">
                        </div>
                        <!-- 使用 1:3 比例的 Grid，确保整齐 -->
                        <div class="grid grid-cols-4 gap-4">
                            <div class="col-span-1">
                                <label class="input-label">Port</label>
                                <input type="text" id="NEZHA_PORT" class="input-box" placeholder="5555">
                            </div>
                            <div class="col-span-3">
                                <label class="input-label">Secret Key</label>
                                <input type="password" id="NEZHA_KEY" class="input-box" placeholder="••••••••">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Group 5 -->
                <div>
                    <div class="section-header">05 / Argo Tunnel</div>
                    <div class="space-y-4">
                        <div>
                            <label class="input-label">Domain</label>
                            <input type="text" id="ARGO_DOMAIN" class="input-box" placeholder="tunnel.example.com">
                        </div>
                        <div>
                            <label class="input-label">Token / Json</label>
                            <input type="password" id="ARGO_AUTH" class="input-box" placeholder="eyJhIjoi...">
                        </div>
                    </div>
                </div>
                
                <!-- Group 6 -->
                <div>
                    <div class="section-header">06 / Telegram Bot</div>
                     <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-1">
                            <label class="input-label">Chat ID</label>
                            <input type="text" id="CHAT_ID" class="input-box" placeholder="">
                        </div>
                        <div class="col-span-2">
                            <label class="input-label">Bot Token</label>
                            <input type="password" id="BOT_TOKEN" class="input-box" placeholder="">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输出区域 -->
        <div class="border-t border-[#222] bg-[#050505] p-6 md:p-8">
             <div class="flex gap-4 mb-4">
                <button onclick="generateConfig('env')" class="flex-1 bg-[#1a1a1a] hover:bg-[#252525] text-gray-300 font-medium py-3 rounded transition text-sm">
                    生成 .ENV 文件
                </button>
                <button onclick="generateConfig('json')" class="flex-1 bg-[#1a1a1a] hover:bg-[#252525] text-gray-300 font-medium py-3 rounded transition text-sm">
                    生成 JSON 配置
                </button>
            </div>
            
            <div class="relative group">
                <textarea id="output" readonly class="w-full h-32 bg-[#000] border border-[#222] text-green-500 font-mono text-xs p-4 rounded focus:outline-none" placeholder="点击上方按钮生成配置..."></textarea>
                <div onclick="copyOutput()" class="absolute top-2 right-2 bg-[#222] text-gray-500 text-[10px] px-2 py-1 rounded cursor-pointer hover:bg-[#333] hover:text-white opacity-0 group-hover:opacity-100 transition">点击复制</div>
            </div>
            <p id="copy-msg" class="text-green-600 text-xs mt-2 text-center opacity-0 transition">已复制到剪贴板</p>
        </div>
    </div>

    <script>
        const fields = [
            "UUID", "FILE_PATH", "NAME", 
            "NEZHA_SERVER", "NEZHA_PORT", "NEZHA_KEY", 
            "ARGO_DOMAIN", "ARGO_AUTH", "ARGO_PORT",
            "HY2_PORT", "TUIC_PORT", "REALITY_PORT", 
            "CFIP", "CFPORT", "UPLOAD_URL", "CHAT_ID", "BOT_TOKEN"
        ];

        function generateUUID() {
            const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
            document.getElementById('UUID').value = uuid;
        }

        function generateConfig(type) {
            let result = "";
            
            if (type === 'env') {
                fields.forEach(field => {
                    const el = document.getElementById(field);
                    if (el && el.value.trim() !== "") {
                        result += `${field}=${el.value.trim()}\n`;
                    }
                });
            } else if (type === 'json') {
                const obj = {};
                fields.forEach(field => {
                    const el = document.getElementById(field);
                    if (el && el.value.trim() !== "") {
                        obj[field] = el.value.trim();
                    }
                });
                result = JSON.stringify(obj, null, 4);
            }

            document.getElementById('output').value = result;
        }

        function copyOutput() {
            const copyText = document.getElementById("output");
            if (!copyText.value) return;
            copyText.select();
            navigator.clipboard.writeText(copyText.value).then(() => {
                const msg = document.getElementById('copy-msg');
                msg.classList.remove('opacity-0');
                setTimeout(() => msg.classList.add('opacity-0'), 2000);
            });
        }
    </script>
</body>
</html>
